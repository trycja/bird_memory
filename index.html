<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bird Words — Memory Game</title>
  <style>
    @font-face {
      font-family: Inter;
      src: url("fonts/InterVariable.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
      color: #f2f8fb;
      background: #061116;
      scrollbar-gutter: stable;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(#03100f66, #03100f66), url("assets/background.jpg") center / cover no-repeat fixed;
    }
    main { width: 100%; max-width: 760px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; }
    header { margin: 0 0 2rem; text-align: left; }
    h1 {
      margin: 0;
      color: #e8e3dc;
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 600;
      letter-spacing: .04em;
      line-height: 1.1;
      text-shadow: 0 4px 24px #00000055;
      text-transform: uppercase;
    }
    h2 { margin: 0; font-size: 1.35rem; font-weight: 600; }
    #mode-title { color: #e8e3dc; font-family: "Segoe UI Semilight", "Segoe UI", Inter, sans-serif; font-weight: 400; text-transform: uppercase; }
    #home, #game {
      border: 1px solid #d5f3ed2e;
      border-radius: 1.5rem;
      box-shadow: 0 20px 60px #00000055, inset 0 1px 0 #ffffff1a;
      padding: clamp(1rem, 3vw, 1.75rem);
    }
    #home {
      background: #07191d0d;
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
    }
    #game { position: relative; isolation: isolate; }
    /* Blur a separate layer so the game navigation remains fixed to the viewport. */
    #game::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      background: #07191d80;
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      pointer-events: none;
    }
    input {
      width: 100%;
      min-width: 0;
      min-height: 44px;
      padding: .5rem;
      border: 1px solid #c9e8e640;
      border-radius: .75rem;
      background: #1c3038;
      color: #f2f8fb;
      font: inherit;
      font-size: 1rem;
    }
    footer { margin-top: auto; padding-top: 1.5rem; }
    .attribution { margin: 0; color: #cbd0da; text-align: center; font-size: .85rem; }
    a { color: #a9dfe9; }
    h1 a { color: inherit; text-decoration: none; }
    h1 a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .status-filter { margin: 1rem 0 1.5rem; padding: 1rem; border: 1px solid #c9e8e640; border-radius: .85rem; }
    .status-filter legend { padding: 0 .4rem; font-weight: 700; }
    .status-filter p { margin: .35rem 0 .75rem; color: #cbd0da; }
    .status-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .25rem .75rem; }
    .status-option { display: flex; align-items: center; gap: .6rem; min-height: 44px; cursor: pointer; }
    .status-option input { width: 1.25rem; height: 1.25rem; min-height: 0; flex: none; accent-color: #62cba6; }
    .difficulty-list { display: grid; gap: .85rem; margin-top: 1rem; }
    .difficulty, .primary, .secondary, .answer, .connect-item {
      border: 1px solid #c9e8e640;
      border-radius: .85rem;
      padding: .7rem .8rem;
      background: #132c22d9;
      box-shadow: 0 8px 20px #00000026, inset 0 1px 0 #ffffff1a;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      font: inherit;
      font-weight: 700;
    }
    .primary, .secondary { border-radius: 999px; }
    button { min-height: 44px; cursor: pointer; touch-action: manipulation; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 3px;
    }
    .primary { background: #1e4937db; color: #f2f8fb; }
    .difficulty {
      --gradient-opacity: .8;
      --difficulty-background: linear-gradient(110deg, rgba(56, 89, 182, var(--gradient-opacity)), rgba(1, 70, 37, var(--gradient-opacity)));
      background: var(--difficulty-background);
      border-color: #b6b9ff88;
      border-radius: 999px;
      padding-inline: 1.3rem;
      box-shadow: 0 8px 24px #703a9c66, inset 0 1px 0 #ffffff44;
      color: #e5e7eb;
      font-weight: 700;
      text-align: left;
      text-transform: lowercase;
    }
    .difficulty:nth-child(2) { --gradient-opacity: .65; }
    .difficulty:nth-child(3) { --gradient-opacity: .5; }
    .difficulty:nth-child(4) { --gradient-opacity: .35; }
    .difficulty:not(:disabled):hover, .primary:not(:disabled):hover,
    .secondary:not(:disabled):hover, .answer:not(:disabled):hover, .connect-item:not(:disabled):hover {
      background: #305d48ed;
      border-color: #ffffff99;
    }
    .difficulty:not(:disabled):active, .primary:not(:disabled):active,
    .secondary:not(:disabled):active, .answer:not(:disabled):active, .connect-item:not(:disabled):active {
      background: #44745bef;
      border-color: #ffffffcc;
    }
    .difficulty:not(:disabled):hover, .difficulty:not(:disabled):active {
      background: var(--difficulty-background);
    }
    .primary:disabled, .difficulty:disabled { opacity: .6; cursor: not-allowed; }
    .difficulty span { display: block; margin-top: .2rem; font-family: "Segoe UI Semilight", "Segoe UI", Inter, sans-serif; font-weight: 400; line-height: 1.4; }
    #home-button:not(.hidden) {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin-top: 1rem;
      background: #173943de;
      color: #f2f8fb;
      border-color: #a6d9bd66;
    }
    #home-button:not(:disabled):hover { background: #305d48ed; border-color: #ffffff; }
    #home-button:not(:disabled):active { background: #44745bef; border-color: #ffffff; }
    #game { padding-bottom: calc(13rem + env(safe-area-inset-bottom)); }
    #fixed-controls {
      position: fixed;
      left: max(.75rem, env(safe-area-inset-left));
      right: max(.75rem, env(safe-area-inset-right));
      bottom: calc(.75rem + env(safe-area-inset-bottom));
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: .75rem;
      pointer-events: none;
    }
    #controls, #continuous-actions:not(.hidden) {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: .75rem;
      max-width: 100%;
    }
    #fixed-controls button { pointer-events: auto; }
    #controls .starter-nav {
      min-width: 8.5rem;
      background: linear-gradient(110deg, rgba(56, 89, 182, .2), rgba(1, 70, 37, .2));
      font-family: "Segoe UI", Inter, sans-serif;
      font-weight: 400;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .75rem;
      margin: 0 0 1rem;
    }
    .secondary {
      background: #173943de;
      color: #f2f8fb;
    }
    .secondary:disabled { opacity: .6; cursor: not-allowed; }
    #progress {
      display: inline-block;
      padding: .4rem .65rem;
      border: 1px solid #9bd0b277;
      border-radius: 999px;
      background: #173d2eeb;
      color: #edf8ef;
      font-weight: 700;
    }
    #progress.hidden { display: none; }
    .prompt {
      margin: 1.5rem 0;
      text-align: center;
      color: #f2f8fb;
      font-size: clamp(1.65rem, 5vw, 2.5rem);
      font-weight: 800;
      overflow-wrap: anywhere;
    }
    .prompt[lang="en"] { color: #b6e5ee; }
    .reserved-answer { visibility: hidden; }
    .bird-photo { margin: 1rem auto; max-width: 500px; text-align: center; }
    .bird-photo img { display: block; max-width: 100%; max-height: 350px; margin: auto; border: 1px solid #c9e8e640; border-radius: 1rem; box-shadow: 0 12px 30px #00000055; }
    .bird-photo figcaption { margin-top: .75rem; color: #cbd0da; font-size: 8px; overflow-wrap: anywhere; }
    .photo-status { text-align: center; color: #cbd0da; }
    .bird-sound { margin: 1rem auto; text-align: center; color: #cbd0da; }
    .bird-sound audio { display: block; max-width: 100%; margin: .5rem auto; }
    .bird-sound p { margin: .5rem 0; overflow-wrap: anywhere; }
    .bird-sound-credit { font-size: .75rem; }
    .answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .85rem; }
    .answer {
      min-height: 4rem;
      color: #f2f8fb;
      overflow-wrap: anywhere;
    }
    .answer:disabled { cursor: default; opacity: 1; }
    .answer.correct { background: linear-gradient(135deg, #254e40, #246f52); border-color: #9cebc2; }
    .answer.incorrect { background: linear-gradient(135deg, #5b303c, #774148); border-color: #ffb9b3; }
    .connect-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
    .connect-list { display: grid; min-width: 0; align-content: start; gap: .75rem; }
    .connect-item {
      --connect-opacity: .75;
      --connect-start: 56, 89, 182;
      --connect-end: 29, 80, 110;
      width: 100%;
      background: linear-gradient(90deg, rgba(var(--connect-start), var(--connect-opacity)), rgba(var(--connect-end), var(--connect-opacity)));
      color: #f2f8fb;
      overflow-wrap: anywhere;
    }
    .connect-item[lang="en"] { --connect-start: 29, 80, 110; --connect-end: 1, 70, 37; }
    .connect-item:nth-child(2) { --connect-opacity: .7; }
    .connect-item:nth-child(3) { --connect-opacity: .65; }
    .connect-item:nth-child(4) { --connect-opacity: .6; }
    .connect-item:nth-child(5) { --connect-opacity: .55; }
    .connect-item:not(:disabled):hover { --connect-opacity: .85; }
    .connect-item:not(:disabled):active { --connect-opacity: .95; }
    .connect-item[aria-pressed="true"] { outline: 3px solid #a9dfe9; outline-offset: 2px; }
    .connect-item.matched {
      background: linear-gradient(90deg, #177348cc, #07553ecc);
      border: 2px solid #b1f3cc;
      cursor: default;
    }
    .connect-item.matched[lang="en"] { background: linear-gradient(90deg, #07553ecc, #013138cc); }
    .connect-item.matched::after { content: " ✓"; }
    .typing-form { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: .5rem; }
    input::placeholder { color: #bfc6d1; opacity: 1; }
    .typing-hint { white-space: pre-wrap; overflow-wrap: anywhere; color: #b6e5ee; }
    .pronunciation { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .5rem .75rem; margin: 1rem 0; text-align: center; }
    .pronunciation p { margin: 0; }
    .pronunciation-button { display: inline-flex; align-items: center; justify-content: center; width: 44px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: #b6e5ee; }
    .pronunciation-button:hover { background: #305d48a6; }
    .pronunciation-button svg { width: 24px; height: 24px; }
    .pronunciation-status { flex-basis: 100%; color: #ffc1ba; }
    #message { min-height: 1.5em; text-align: center; font-family: "Segoe UI", Inter, sans-serif; font-weight: 700; color: #c3e9ee; }
    #message.correct, #message.almost, #message.wrong { font-size: 1rem; }
    #message.correct { color: #b1f3cc; }
    #message.almost { color: #ffe3a1; }
    #message.wrong { color: #ffc1ba; }
    .hidden { display: none; }
    @media (min-width: 601px) {
      #game { padding-bottom: clamp(1rem, 3vw, 1.75rem); }
      #fixed-controls { position: static; }
    }
    @media (max-width: 600px) {
      body { padding: 1.25rem .75rem; }
      header { margin-bottom: 1.5rem; }
      .status-options { grid-template-columns: 1fr; }
      .answers { grid-template-columns: 1fr; }
      .connect-columns { gap: .45rem; }
      .connect-item { padding: .65rem .45rem; }
      .typing-form { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .typing-form input { grid-column: 1 / -1; }
      #game:not(.hidden) + footer { padding-bottom: calc(10rem + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1><a href="index.html" aria-label="Bird Words — restart page">Bird Words</a></h1>
      <button class="secondary hidden" id="home-button" type="button">
        <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        Choose difficulty
      </button>
    </header>
    <section id="home" aria-labelledby="choose-title">
      <h2 id="choose-title">Choose a difficulty</h2>
      <fieldset class="status-filter">
        <legend>Filter birds by status in Poland</legend>
        <p>Select any categories to include. Leave all unchecked to use every bird.</p>
        <div class="status-options">
          <label class="status-option"><input type="checkbox" name="status" value="breeding"> Breeding</label>
          <label class="status-option"><input type="checkbox" name="status" value="migrating"> Migrating or wintering</label>
          <label class="status-option"><input type="checkbox" name="status" value="rare"> Rare visitor</label>
          <label class="status-option"><input type="checkbox" name="status" value="exceptional"> Exceptional visitor</label>
          <label class="status-option"><input type="checkbox" name="status" value="historical"> Historical</label>
          <label class="status-option"><input type="checkbox" name="status" value="captive"> Captive origin</label>
        </div>
        <p id="status-filter-message" role="status" aria-live="polite"></p>
        <button id="clear-status-filter" class="secondary" type="button">Clear filter</button>
      </fieldset>
      <div class="difficulty-list">
        <button class="difficulty" type="button" data-mode="0">Starter show<span>Read the Polish name and reveal its English translation.</span></button>
        <button class="difficulty" type="button" data-mode="1">Pick a translation<span>Choose the correct English name from four options.</span></button>
        <button class="difficulty" type="button" data-mode="2">Connect<span>Match each Polish name with its English translation.</span></button>
        <button class="difficulty" type="button" data-mode="3">Type it in<span>Type the translation of each bird name.</span></button>
      </div>
    </section>
    <section id="game" class="hidden" aria-labelledby="mode-title">
      <div class="toolbar">
        <h2 id="mode-title"></h2>
      </div>
      <p id="progress"></p>
      <div id="activity"></div>
      <div id="pronunciation"></div>
      <p id="message" role="status" aria-live="polite"></p>
      <div id="fixed-controls">
        <div id="controls"></div>
        <div id="continuous-actions" class="hidden"></div>
      </div>
    </section>
    <footer>
      <p class="attribution">Bird list adapted from <a href="https://pl.wikipedia.org/w/index.php?title=Ptaki_Polski&amp;oldid=80130065" target="_blank" rel="noopener noreferrer">Polish Wikipedia</a> and <a href="https://en.wikipedia.org/w/index.php?title=List_of_birds_of_Poland&amp;oldid=1377457040" target="_blank" rel="noopener noreferrer">English Wikipedia</a>, by their contributors · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a>.</p>
    </footer>
  </main>
  <script src="birds.js"></script>
  <script>
    const modes = [
      "Starter show",
      "Pick a translation",
      "Connect",
      "Type it in"
    ];
    const home = document.getElementById("home");
    const homeButton = document.getElementById("home-button");
    const game = document.getElementById("game");
    const modeTitle = document.getElementById("mode-title");
    const progress = document.getElementById("progress");
    const activity = document.getElementById("activity");
    const pronunciation = document.getElementById("pronunciation");
    const message = document.getElementById("message");
    const controls = document.getElementById("controls");
    const continuousActions = document.getElementById("continuous-actions");
    const statusInputs = [...document.querySelectorAll('input[name="status"]')];
    const statusFilterMessage = document.getElementById("status-filter-message");
    const clearStatusFilter = document.getElementById("clear-status-filter");
    const difficultyButtons = [...document.querySelectorAll(".difficulty")];
    let activeBirds = birds;
    let round = [];
    let mode = 0;
    let index = 0;
    let correctCount = 0;
    let answered = false;
    let selectedSource = null;
    let matched = new Set();
    let mistakes = new Set();
    let continuous = false;
    let practicing = false;
    let completedBirds = 0;
    let pausedGame = null;
    let birdSoundContainer = null;
    let birdSoundAudio = null;

    function shuffle(items) {
      const shuffled = [...items];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function makeButton(text, className, onClick) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = className;
      button.textContent = text;
      button.addEventListener("click", onClick);
      return button;
    }

    function clearPronunciation() {
      pronunciation.replaceChildren();
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function showPronunciation(bird) {
      const guide = document.createElement("p");
      guide.lang = "en";
      guide.textContent = `${bird.en} · approximate IPA: /${bird.pronunciation}/`;
      const status = document.createElement("p");
      status.className = "pronunciation-status";
      status.setAttribute("role", "status");
      const listen = makeButton("", "pronunciation-button", () => {
        status.textContent = "";
        if (!window.speechSynthesis || typeof window.SpeechSynthesisUtterance !== "function") {
          status.textContent = "Speech is not supported in this browser.";
          return;
        }
        try {
          const voice = window.speechSynthesis.getVoices().find(item =>
            /^en[-_]gb(?:[-_]|$)/i.test(item.lang)
          );
          if (!voice) {
            status.textContent = "No British English voice is available on this device.";
            return;
          }
          const utterance = new window.SpeechSynthesisUtterance(bird.en);
          utterance.lang = "en-GB";
          utterance.voice = voice;
          utterance.onerror = event => {
            if (event.error !== "interrupted" && event.error !== "canceled") {
              status.textContent = `Could not play pronunciation: ${event.error}.`;
            }
          };
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(utterance);
        } catch (error) {
          status.textContent = `Could not play pronunciation: ${error.message}`;
        }
      });
      listen.setAttribute("aria-label", `Listen to the English pronunciation of ${bird.en}`);
      listen.setAttribute("title", "Listen to pronunciation");
      const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      icon.setAttribute("viewBox", "0 0 24 24");
      icon.setAttribute("fill", "none");
      icon.setAttribute("stroke", "currentColor");
      icon.setAttribute("stroke-width", "2");
      icon.setAttribute("stroke-linecap", "round");
      icon.setAttribute("stroke-linejoin", "round");
      icon.setAttribute("aria-hidden", "true");
      const shape = document.createElementNS("http://www.w3.org/2000/svg", "path");
      shape.setAttribute("d", "M11 5 6 9H3v6h3l5 4V5ZM15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12");
      icon.append(shape);
      listen.append(icon);
      const content = document.createElement("div");
      content.className = "pronunciation";
      content.append(guide, listen, status);
      pronunciation.replaceChildren(content);
      return content;
    }

    function filteredBirds() {
      const selected = new Set(statusInputs.filter(input => input.checked).map(input => input.value));
      return selected.size === 0
        ? birds
        : birds.filter(bird => bird.categories.some(category => selected.has(category)));
    }

    function updateStatusFilter() {
      const count = filteredBirds().length;
      statusFilterMessage.textContent = count
        ? `${count} ${count === 1 ? "bird matches" : "birds match"} this selection.${count < 5 ? " Rounds will be shorter than five birds." : ""}`
        : "No birds match this selection. Choose another status.";
      clearStatusFilter.disabled = !statusInputs.some(input => input.checked);
      difficultyButtons.forEach(button => { button.disabled = count === 0; });
    }

    function startMode(selectedMode) {
      activeBirds = filteredBirds();
      if (!activeBirds.length) {
        updateStatusFilter();
        return;
      }
      mode = selectedMode;
      continuous = mode === 0;
      practicing = false;
      completedBirds = 0;
      pausedGame = null;
      modeTitle.textContent = modes[mode];
      home.classList.add("hidden");
      game.classList.remove("hidden");
      homeButton.classList.remove("hidden");
      startRound(shuffle(activeBirds).slice(0, 5));
    }

    function inContinuousPlay() {
      return continuous && !practicing;
    }

    function updateContinuousActions() {
      continuousActions.replaceChildren();
      const showActions = inContinuousPlay() && mode !== 0;
      continuousActions.classList.toggle("hidden", !showActions);
      if (!showActions) return;
      const fixButton = makeButton("Fix mistakes", "secondary", startPractice);
      fixButton.disabled = mistakes.size === 0;
      continuousActions.append(fixButton, makeButton("Start over", "secondary", restartContinuous));
    }

    function keepPlaying() {
      continuous = true;
      completedBirds = round.length;
      round = shuffle(activeBirds).slice(0, 5);
      index = 0;
      matched = new Set();
      selectedSource = null;
      renderQuestion();
    }

    function restartContinuous() {
      completedBirds = 0;
      startRound(shuffle(activeBirds).slice(0, 5));
    }

    function startPractice() {
      if (!mistakes.size) return;
      pausedGame = {
        round, index, correctCount, answered, selectedSource, matched,
        activityNodes: [...activity.childNodes],
        pronunciationNodes: [...pronunciation.childNodes],
        controlNodes: [...controls.childNodes],
        progressText: progress.textContent,
        messageText: message.textContent,
        messageClass: message.className
      };
      practicing = true;
      startRound(shuffle([...mistakes]));
    }

    function resumeContinuous() {
      const remainingMistakes = mistakes;
      ({ round, index, correctCount, answered, selectedSource, matched } = pausedGame);
      activity.replaceChildren(...pausedGame.activityNodes);
      clearPronunciation();
      pronunciation.replaceChildren(...pausedGame.pronunciationNodes);
      controls.replaceChildren(...pausedGame.controlNodes);
      progress.textContent = pausedGame.progressText;
      message.className = pausedGame.messageClass;
      message.textContent = `Practice complete. ${pausedGame.messageText}`.trim();
      mistakes = remainingMistakes;
      practicing = false;
      pausedGame = null;
      updateContinuousActions();
    }

    function startRound(roundBirds) {
      round = roundBirds;
      index = 0;
      correctCount = 0;
      answered = false;
      selectedSource = null;
      matched = new Set();
      mistakes = new Set();
      renderQuestion();
    }

    function updateProgress() {
      progress.classList.toggle("hidden", mode === 0);
      progress.textContent = mode === 2
        ? `Matched ${matched.size} of ${round.length} pairs${inContinuousPlay() ? ` · Total correct: ${correctCount}` : ""}`
        : inContinuousPlay()
          ? `Bird ${completedBirds + 1} · Correct: ${correctCount}`
          : `Bird ${index + 1} of ${round.length} · Correct: ${correctCount}`;
    }

    function finishRound() {
      stopBirdSound();
      if (practicing) {
        resumeContinuous();
        return;
      }
      activity.replaceChildren();
      clearPronunciation();
      message.classList.remove("hidden");
      progress.textContent = `Round complete · Correct: ${correctCount} of ${round.length}`;
      message.classList.remove("correct", "almost", "wrong");
      message.textContent = mistakes.size
        ? `Practice the ${mistakes.size} ${mistakes.size === 1 ? "bird" : "birds"} you missed, keep playing, or choose another difficulty.`
        : "Great work! Keep playing or choose another difficulty.";
      controls.replaceChildren();
      if (mistakes.size) {
        controls.append(makeButton("Fix mistakes", "primary", () => startRound(shuffle([...mistakes]))));
      }
      controls.append(makeButton("Keep playing", "primary", keepPlaying));
    }

    function renderQuestion() {
      stopBirdSound();
      activity.replaceChildren();
      controls.replaceChildren();
      clearPronunciation();
      message.classList.remove("correct", "almost", "wrong");
      message.classList.toggle("hidden", mode === 0);
      message.textContent = "";
      answered = false;
      updateContinuousActions();
      updateProgress();
      if (mode === 0) renderShow();
      if (mode === 1) renderChoice();
      if (mode === 2) renderConnect();
      if (mode === 3) renderTyping();
    }

    function stopBirdSound() {
      birdSoundContainer = null;
      if (birdSoundAudio) birdSoundAudio.pause();
      birdSoundAudio = null;
    }

    function createBirdSound(bird) {
      const container = document.createElement("div");
      container.className = "bird-sound";
      birdSoundContainer = container;
      const status = document.createElement("p");
      status.setAttribute("role", "status");
      if (!bird.soundFile) {
        status.textContent = "No bird sound available for this bird.";
        container.append(status);
        return container;
      }

      const load = makeButton("Load bird sound", "secondary", async () => {
        load.disabled = true;
        status.textContent = "Loading bird sound…";
        try {
          const url = new URL("https://commons.wikimedia.org/w/api.php");
          url.search = new URLSearchParams({
            action: "query", prop: "videoinfo", titles: `File:${bird.soundFile}`,
            viprop: "url|derivatives|extmetadata", format: "json", origin: "*"
          });
          const response = await fetch(url);
          if (!response.ok) throw new Error(`Wikimedia Commons returned HTTP ${response.status}.`);
          const data = await response.json();
          const file = Object.values(data.query.pages)[0];
          const info = file.videoinfo && file.videoinfo[0];
          const metadata = info && info.extmetadata;
          const text = field => {
            const value = metadata && metadata[field] && metadata[field].value;
            return value ? new DOMParser().parseFromString(value, "text/html").body.textContent.trim() : "";
          };
          const artist = text("Artist");
          const attribution = text("Attribution");
          const license = text("LicenseShortName");
          const publicDomain = text("Copyrighted") === "False" && license === "Public domain";
          const licenseUrl = text("LicenseUrl");
          if (!info || !info.url || !info.descriptionurl || !license || (!publicDomain && (!artist || !licenseUrl))) {
            throw new Error("Recording credit or license information is missing.");
          }
          const sourceUrl = new URL(info.descriptionurl);
          const originalUrl = new URL(info.url);
          const licenseLinkUrl = licenseUrl ? new URL(licenseUrl) : null;
          const validAudioUrl = audioUrl => audioUrl.protocol === "https:" && audioUrl.hostname === "upload.wikimedia.org";
          if (!validAudioUrl(originalUrl) || sourceUrl.protocol !== "https:" || sourceUrl.hostname !== "commons.wikimedia.org"
            || (licenseLinkUrl && (licenseLinkUrl.protocol !== "https:" || licenseLinkUrl.hostname !== "creativecommons.org"
              || !/^\/(?:licenses\/(?:by|by-sa)|publicdomain\/(?:zero|mark))\/[0-9.]+\/?$/.test(licenseLinkUrl.pathname)))) {
            throw new Error("Recording or credit links are not valid.");
          }
          if (birdSoundContainer !== container) return;

          const audio = document.createElement("audio");
          audio.controls = true;
          audio.preload = "none";
          audio.setAttribute("aria-label", `Bird sound: ${bird.pl}`);
          const mp3 = (info.derivatives || []).find(item => item.type === "audio/mpeg");
          if (mp3) {
            const mp3Url = new URL(mp3.src);
            if (validAudioUrl(mp3Url)) {
              const source = document.createElement("source");
              source.src = mp3Url.href;
              source.type = "audio/mpeg";
              audio.append(source);
            }
          }
          const original = document.createElement("source");
          original.src = originalUrl.href;
          original.type = "audio/ogg";
          audio.append(original);
          const playbackFailed = () => { status.textContent = "Bird sound unavailable: playback failed."; };
          original.addEventListener("error", playbackFailed);
          audio.addEventListener("error", playbackFailed);
          const credit = document.createElement("p");
          credit.className = "bird-sound-credit";
          const sourceLink = document.createElement("a");
          sourceLink.href = sourceUrl.href;
          sourceLink.target = "_blank";
          sourceLink.rel = "noopener noreferrer";
          sourceLink.textContent = file.title.replace(/^File:/, "");
          const licenseLink = document.createElement("a");
          licenseLink.href = licenseLinkUrl ? licenseLinkUrl.href : sourceUrl.href;
          licenseLink.target = "_blank";
          licenseLink.rel = "noopener noreferrer";
          licenseLink.textContent = license;
          const creditText = attribution && attribution !== artist ? `${artist} (${attribution})` : artist;
          credit.append(sourceLink, document.createTextNode(`${creditText ? ` by ${creditText}` : ""} · `), licenseLink);
          if (mp3 && audio.children.length > 1) credit.append(document.createTextNode(" · audio may be transcoded"));
          birdSoundAudio = audio;
          status.textContent = "Bird sound ready.";
          container.replaceChildren(status, audio, credit);
        } catch (error) {
          if (birdSoundContainer !== container) return;
          status.textContent = `Bird sound unavailable: ${error.message}`;
          load.disabled = false;
        }
      });
      load.setAttribute("aria-label", `Load bird sound for ${bird.pl}`);
      container.append(load, status);
      return container;
    }

    async function showBirdPhoto(bird, container) {
      if (!bird.scientificName) {
        container.textContent = "Photo unavailable: no scientific name for this bird.";
        return;
      }

      try {
        const wikipediaUrl = new URL("https://en.wikipedia.org/w/api.php");
        wikipediaUrl.search = new URLSearchParams({
          action: "query", prop: "pageimages", titles: bird.scientificName,
          redirects: "1", piprop: "name", pilicense: "free", format: "json", origin: "*"
        });
        const pageResponse = await fetch(wikipediaUrl);
        if (!pageResponse.ok) throw new Error(`Wikipedia returned HTTP ${pageResponse.status}.`);
        const pageData = await pageResponse.json();
        const page = Object.values(pageData.query.pages)[0];
        if (!page.pageimage) throw new Error("No suitable image was found.");

        const commonsUrl = new URL("https://commons.wikimedia.org/w/api.php");
        commonsUrl.search = new URLSearchParams({
          action: "query", prop: "imageinfo", titles: `File:${page.pageimage}`,
          iiprop: "url|extmetadata", iiurlwidth: "500", format: "json", origin: "*"
        });
        const imageResponse = await fetch(commonsUrl);
        if (!imageResponse.ok) throw new Error(`Wikimedia Commons returned HTTP ${imageResponse.status}.`);
        const imageData = await imageResponse.json();
        const file = Object.values(imageData.query.pages)[0];
        const info = file.imageinfo && file.imageinfo[0];
        const metadata = info && info.extmetadata;
        const artistHtml = metadata && metadata.Artist && metadata.Artist.value;
        const license = metadata && metadata.LicenseShortName && metadata.LicenseShortName.value;
        const licenseUrl = metadata && metadata.LicenseUrl && metadata.LicenseUrl.value;
        const artist = artistHtml && new DOMParser().parseFromString(artistHtml, "text/html").body.textContent.trim();
        const attributionHtml = metadata && metadata.Attribution && metadata.Attribution.value;
        const attribution = attributionHtml && new DOMParser().parseFromString(attributionHtml, "text/html").body.textContent.trim();
        if (!info || !info.thumburl || !info.descriptionurl || !artist || !license || !licenseUrl) {
          throw new Error("Image credit or license information is missing.");
        }
        const imageUrl = new URL(info.thumburl);
        const sourceUrl = new URL(info.descriptionurl);
        const licenseLinkUrl = new URL(licenseUrl);
        if (imageUrl.protocol !== "https:" || !["upload.wikimedia.org", "thumb.wikimedia.org"].includes(imageUrl.hostname)
          || sourceUrl.protocol !== "https:" || sourceUrl.hostname !== "commons.wikimedia.org"
          || licenseLinkUrl.protocol !== "https:" || licenseLinkUrl.hostname !== "creativecommons.org"
          || !/^\/(?:licenses\/(?:by|by-sa)|publicdomain\/(?:zero|mark))\/[0-9.]+\/?$/.test(licenseLinkUrl.pathname)) {
          throw new Error("Image or credit links are not valid.");
        }

        const figure = document.createElement("figure");
        figure.className = "bird-photo";
        const image = document.createElement("img");
        image.alt = `Zdjęcie: ${bird.pl}`;
        image.lang = "pl";
        image.addEventListener("error", () => {
          if (container.isConnected) container.textContent = "Photo unavailable: the image could not be loaded.";
        });
        image.src = imageUrl.href;
        const caption = document.createElement("figcaption");
        const source = document.createElement("a");
        source.href = sourceUrl.href;
        source.target = "_blank";
        source.rel = "noopener noreferrer";
        source.textContent = "Wikimedia Commons";
        const licenseLink = document.createElement("a");
        licenseLink.href = licenseLinkUrl.href;
        licenseLink.target = "_blank";
        licenseLink.rel = "noopener noreferrer";
        licenseLink.textContent = license;
        const credit = attribution && attribution !== artist ? `${artist} (${attribution})` : artist;
        caption.append(source, document.createTextNode(` by ${credit} · resized · `), licenseLink);
        figure.append(image, caption);
        container.replaceChildren(figure);
      } catch (error) {
        container.textContent = `Photo unavailable: ${error.message}`;
      }
    }

    function createBirdPhoto(bird) {
      const photo = document.createElement("div");
      photo.className = "photo-status";
      photo.setAttribute("role", "status");
      photo.textContent = "Loading bird photo…";
      showBirdPhoto(bird, photo);
      return photo;
    }

    function renderShow() {
      const bird = round[index];
      const prompt = document.createElement("p");
      prompt.className = "prompt";
      prompt.lang = "pl";
      prompt.textContent = bird.pl;
      const photo = createBirdPhoto(bird);
      const answer = document.createElement("p");
      answer.className = "prompt reserved-answer";
      answer.lang = "en";
      answer.textContent = bird.en;
      answer.setAttribute("aria-hidden", "true");
      activity.append(prompt, answer, photo, createBirdSound(bird));
      const pronunciationGuide = showPronunciation(bird);
      pronunciationGuide.classList.add("reserved-answer");
      pronunciationGuide.setAttribute("aria-hidden", "true");
      function setStarterControls(button) {
        button.classList.add("starter-nav");
        controls.replaceChildren(button);
      }
      setStarterControls(makeButton("Show English", "primary", () => {
        if (answered) return;
        answered = true;
        answer.classList.remove("reserved-answer");
        answer.removeAttribute("aria-hidden");
        pronunciationGuide.classList.remove("reserved-answer");
        pronunciationGuide.removeAttribute("aria-hidden");
        correctCount++;
        const nextButton = makeButton("Next bird", "primary", nextQuestion);
        setStarterControls(nextButton);
      }));
    }

    function choiceOptions(bird) {
      const candidates = [
        ...shuffle(activeBirds.filter(item => item.family === bird.family)),
        ...shuffle(activeBirds),
        ...shuffle(birds.filter(item => item.family === bird.family)),
        ...shuffle(birds)
      ];
      const seen = new Set([bird.pl]);
      const alternatives = [];
      for (const candidate of candidates) {
        if (!candidate.pl || seen.has(candidate.pl)) continue;
        seen.add(candidate.pl);
        alternatives.push(candidate);
        if (alternatives.length === 3) break;
      }
      return shuffle([bird, ...alternatives]);
    }

    function renderChoice() {
      const bird = round[index];
      const prompt = document.createElement("p");
      prompt.className = "prompt";
      prompt.lang = "pl";
      prompt.textContent = bird.pl;
      activity.append(prompt, createBirdPhoto(bird));
      const pronunciationGuide = showPronunciation(bird);
      pronunciationGuide.classList.add("reserved-answer");
      pronunciationGuide.setAttribute("aria-hidden", "true");
      const nextPlaceholder = makeButton("Next bird", "primary", () => {});
      nextPlaceholder.classList.add("reserved-answer");
      nextPlaceholder.setAttribute("aria-hidden", "true");
      nextPlaceholder.disabled = true;
      controls.replaceChildren(nextPlaceholder);
      const options = choiceOptions(bird);
      const answers = document.createElement("div");
      answers.className = "answers";
      const optionTitles = new Map();
      for (const option of options) {
        const button = makeButton(option.en, "answer", () => {
          if (answered) return;
          answered = true;
          const isCorrect = option === bird;
          if (isCorrect) correctCount++;
          else mistakes.add(bird);
          message.classList.add(isCorrect ? "correct" : "wrong");
          updateContinuousActions();
          button.classList.add(isCorrect ? "correct" : "incorrect");
          for (const choice of answers.children) choice.disabled = true;
          for (const choice of answers.children) {
            const choiceOption = optionTitles.get(choice);
            if (choiceOption) choice.setAttribute("title", choiceOption.pl);
          }
          message.textContent = isCorrect ? "Correct!" : `Not quite. The answer is ${bird.en}.`;
          pronunciationGuide.classList.remove("reserved-answer");
          pronunciationGuide.removeAttribute("aria-hidden");
          showNextButton();
        });
        button.lang = "en";
        optionTitles.set(button, option);
        answers.append(button);
      }
      activity.append(answers);
    }

    function renderConnect() {
      const instructions = document.createElement("p");
      instructions.textContent = "Drag a Polish name to its English translation, or select a name and then its translation.";
      const columns = document.createElement("div");
      columns.className = "connect-columns";
      const polishList = document.createElement("div");
      polishList.className = "connect-list";
      polishList.setAttribute("aria-label", "Polish bird names");
      const englishList = document.createElement("div");
      englishList.className = "connect-list";
      englishList.setAttribute("aria-label", "English bird names");

      for (const bird of shuffle(round)) {
        const source = makeButton(bird.pl, "connect-item", () => {
          if (matched.has(bird)) return;
          selectedSource = bird;
          for (const item of polishList.children) item.setAttribute("aria-pressed", String(item === source));
          message.textContent = `Selected ${bird.pl}. Choose its English translation.`;
        });
        source.lang = "pl";
        source.draggable = true;
        source.setAttribute("aria-pressed", "false");
        source.addEventListener("dragstart", event => {
          event.dataTransfer.setData("text/plain", String(round.indexOf(bird)));
          event.dataTransfer.effectAllowed = "move";
          selectedSource = bird;
        });
        polishList.append(source);

        const target = makeButton(bird.en, "connect-item", () => {
          if (selectedSource) connectPair(selectedSource, bird);
        });
        target.lang = "en";
        target.addEventListener("dragover", event => {
          if (!matched.has(bird)) event.preventDefault();
        });
        target.addEventListener("drop", event => {
          event.preventDefault();
          const sourceIndex = Number(event.dataTransfer.getData("text/plain"));
          const draggedBird = round[sourceIndex];
          if (draggedBird) connectPair(draggedBird, bird);
        });
        englishList.append(target);
      }
      englishList.replaceChildren(...shuffle([...englishList.children]));
      columns.append(polishList, englishList);
      activity.append(instructions, columns);
      updateProgress();
    }

    function connectPair(source, target) {
      if (matched.has(source) || matched.has(target)) return;
      if (source !== target) {
        mistakes.add(source);
        updateContinuousActions();
        selectedSource = null;
        const selectedButton = activity.querySelector('.connect-item[lang="pl"][aria-pressed="true"]');
        if (selectedButton) selectedButton.setAttribute("aria-pressed", "false");
        message.textContent = `Those names do not match. Try again.`;
        return;
      }
      matched.add(source);
      correctCount++;
      selectedSource = null;
      const items = activity.querySelectorAll(".connect-item");
      for (const item of items) {
        if ((item.lang === "pl" && item.textContent === source.pl)
          || (item.lang === "en" && item.textContent === source.en)) {
          item.classList.add("matched");
          item.disabled = true;
          item.setAttribute("aria-pressed", "false");
        }
      }
      updateProgress();
      message.textContent = `Matched ${source.pl} with ${source.en}.`;
      showPronunciation(source);
      if (matched.size === round.length) {
        if (inContinuousPlay()) {
          controls.replaceChildren(makeButton("Next birds", "primary", nextConnectGroup));
        } else {
          finishRound();
        }
      }
    }

    function nextConnectGroup() {
      completedBirds += round.length;
      round = shuffle(activeBirds).slice(0, 5);
      matched = new Set();
      selectedSource = null;
      renderQuestion();
    }

    function typingResult(input, answer) {
      const actual = Array.from(input.trim().normalize("NFC").toLocaleLowerCase("pl"));
      const expected = Array.from(answer.trim().normalize("NFC").toLocaleLowerCase("pl"));
      if (actual.join("") === expected.join("")) return "correct";
      if (!actual.length || Math.abs(actual.length - expected.length) > 1) return "wrong";

      if (actual.length === expected.length) {
        const differences = [];
        for (let i = 0; i < actual.length; i++) {
          if (actual[i] !== expected[i]) differences.push(i);
        }
        if (differences.length === 1) return "almost";
        if (differences.length === 2
          && differences[1] === differences[0] + 1
          && actual[differences[0]] === expected[differences[1]]
          && actual[differences[1]] === expected[differences[0]]) return "almost";
        return "wrong";
      }

      const shorter = actual.length < expected.length ? actual : expected;
      const longer = actual.length < expected.length ? expected : actual;
      let shortIndex = 0;
      let longIndex = 0;
      let skipped = false;
      while (shortIndex < shorter.length && longIndex < longer.length) {
        if (shorter[shortIndex] === longer[longIndex]) {
          shortIndex++;
        } else if (skipped) {
          return "wrong";
        } else {
          skipped = true;
        }
        longIndex++;
      }
      return "almost";
    }

    function renderTyping() {
      const bird = round[index];
      const promptLanguage = Math.random() < 0.5 ? "en" : "pl";
      const answerLanguage = promptLanguage === "en" ? "pl" : "en";
      const prompt = document.createElement("p");
      prompt.className = "prompt";
      prompt.lang = promptLanguage;
      prompt.textContent = bird[promptLanguage];
      const form = document.createElement("form");
      form.className = "typing-form";
      const input = document.createElement("input");
      input.type = "text";
      input.autocomplete = "off";
      input.placeholder = `${answerLanguage === "en" ? "English" : "Polish"} translation`;
      input.setAttribute("aria-label", `Type the ${input.placeholder}`);
      input.required = true;
      const submit = document.createElement("button");
      submit.type = "submit";
      submit.className = "primary";
      submit.textContent = "Check answer";
      const answerCharacters = Array.from(bird[answerLanguage].normalize("NFC"));
      const letterPositions = answerCharacters.flatMap((character, position) =>
        /\p{L}/u.test(character) ? [position] : []
      );
      const hintCharacters = answerCharacters.map(character => /\p{L}/u.test(character) ? "_" : character);
      let revealedLetters = 0;
      const hint = document.createElement("p");
      hint.id = "typing-hint";
      hint.className = "typing-hint";
      hint.lang = answerLanguage;
      hint.setAttribute("role", "status");
      const showLetter = makeButton("Show letter", "secondary", () => {
        const position = letterPositions[revealedLetters++];
        hintCharacters[position] = answerCharacters[position];
        hint.textContent = `Hint: ${hintCharacters.join("")}`;
        showLetter.disabled = revealedLetters === letterPositions.length;
      });
      showLetter.setAttribute("aria-controls", hint.id);
      showLetter.disabled = letterPositions.length === 0;
      form.append(input, document.createTextNode(" "), submit, document.createTextNode(" "), showLetter);
      form.addEventListener("submit", event => {
        event.preventDefault();
        if (answered) return;
        let result = typingResult(input.value, bird[answerLanguage]);
        if (answerLanguage === "en" && /^(?:common|eurasian)\s+/i.test(bird.en)) {
          const shorterResult = typingResult(input.value, bird.en.replace(/^(?:common|eurasian)\s+/i, ""));
          if (shorterResult === "correct" || (result === "wrong" && shorterResult === "almost")) {
            result = shorterResult;
          }
        }
        answered = true;
        if (result === "correct") correctCount++;
        else mistakes.add(bird);
        updateContinuousActions();
        input.disabled = true;
        submit.disabled = true;
        showLetter.disabled = true;
        message.classList.add(result);
        message.textContent = result === "correct"
          ? "Correct!"
          : `${result === "almost" ? "Almost:" : "Wrong!"} The correct answer is ${bird[answerLanguage]}.`;
        showPronunciation(bird);
        showNextButton();
      });
      activity.append(prompt, form, hint);
      if (promptLanguage === "en") showPronunciation(bird);
      if (!window.matchMedia("(pointer: coarse)").matches) input.focus();
    }

    function showNextButton() {
      controls.replaceChildren(makeButton(
        !inContinuousPlay() && index === round.length - 1 ? "Finish round" : "Next bird",
        "primary",
        nextQuestion
      ));
    }

    function nextQuestion() {
      if (!answered) return;
      if (inContinuousPlay()) {
        completedBirds++;
        if (index === round.length - 1) {
          round = shuffle(activeBirds).slice(0, 5);
          index = 0;
        } else {
          index++;
        }
        renderQuestion();
        return;
      }
      if (index === round.length - 1) {
        finishRound();
        return;
      }
      index++;
      renderQuestion();
    }

    function showHome() {
      stopBirdSound();
      game.classList.add("hidden");
      home.classList.remove("hidden");
      homeButton.classList.add("hidden");
      message.textContent = "";
      clearPronunciation();
    }

    statusInputs.forEach(input => input.addEventListener("change", updateStatusFilter));
    clearStatusFilter.addEventListener("click", () => {
      statusInputs.forEach(input => { input.checked = false; });
      updateStatusFilter();
    });
    updateStatusFilter();
    difficultyButtons.forEach(button => {
      button.addEventListener("click", () => startMode(Number(button.dataset.mode)));
    });
    homeButton.addEventListener("click", showHome);
  </script>
</body>
</html>

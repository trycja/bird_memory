<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bird Words — Memory Game</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      color: #e6eee8;
      background: #111915;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2rem 1rem; }
    main { max-width: 760px; margin: auto; }
    header { text-align: center; }
    h1 { margin: .25rem 0; font-size: clamp(2rem, 6vw, 3rem); }
    h2 { margin: 0; font-size: 1.35rem; }
    .subtitle { color: #a7b8ab; line-height: 1.5; }
    .location-controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: .75rem; margin: 1rem 0 .5rem; }
    .location-field { display: grid; gap: .35rem; font-weight: 700; }
    select { min-height: 2.8rem; padding: .5rem; border: 2px solid #506e59; border-radius: .5rem; background: #202b24; color: #e6eee8; font: inherit; }
    #location-status { min-height: 1.5em; color: #9cc9a5; }
    .attribution { color: #a7b8ab; text-align: center; font-size: .85rem; }
    a { color: #a7d6b1; }
    .difficulty-list { display: grid; gap: .75rem; margin-top: 1rem; }
    .difficulty, .primary, .secondary, .answer, .connect-item {
      border-radius: .65rem;
      padding: .8rem 1rem;
      font: inherit;
      font-weight: 700;
    }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid #f0bf62;
      outline-offset: 3px;
    }
    .difficulty, .primary {
      border: 0;
      background: #28523a;
      color: #f4f8f4;
    }
    .difficulty { text-align: left; }
    .difficulty:hover, .primary:hover { background: #356a49; }
    .difficulty span { display: block; margin-top: .2rem; font-weight: 400; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .75rem;
      margin: 1.75rem 0 1rem;
    }
    .secondary {
      border: 2px solid #506e59;
      background: #202b24;
      color: #e6eee8;
    }
    .secondary:hover, .answer:hover, .connect-item:hover { background: #2b3b30; }
    .prompt {
      margin: 1.5rem 0;
      text-align: center;
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 700;
    }
    .answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
    .answer {
      min-height: 4rem;
      border: 2px solid #506e59;
      background: #202b24;
      color: #e6eee8;
    }
    .answer:disabled { cursor: default; opacity: 1; }
    .answer.correct, .connect-item.matched { background: #23442d; border-color: #6ca677; }
    .answer.incorrect { background: #4a2b29; border-color: #bd766c; }
    .connect-columns { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    .connect-list { display: grid; align-content: start; gap: .55rem; }
    .connect-item { width: 100%; border: 2px solid #506e59; background: #202b24; color: #e6eee8; }
    .connect-item[aria-pressed="true"] { outline: 3px solid #f0bf62; outline-offset: 2px; }
    .connect-item.matched { cursor: default; }
    input { min-height: 2.8rem; padding: .5rem; border: 2px solid #506e59; border-radius: .5rem; background: #202b24; color: #e6eee8; font: inherit; }
    #message { min-height: 1.5em; text-align: center; font-weight: 700; color: #9cc9a5; }
    .hidden { display: none; }
    @media (max-width: 420px) {
      body { padding: 1.25rem .75rem; }
      .location-controls { grid-template-columns: 1fr; }
      .answers { grid-template-columns: 1fr; }
      .connect-columns { gap: .45rem; }
      .connect-item { padding: .65rem .45rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Bird Words</h1>
      <p class="subtitle">Learn bird names in English and Polish.</p>
    </header>
    <section id="home" aria-labelledby="location-title">
      <h2 id="location-title">Choose a location</h2>
      <div class="location-controls">
        <label class="location-field" for="location-select">Recent bird reports near
          <select id="location-select">
            <option value="biebrza">Biebrzański Park Narodowy (50 km radius)</option>
            <option value="krakow">Kraków (30 km radius)</option>
          </select>
        </label>
        <button class="primary" id="load-location" type="button">Load birds</button>
      </div>
      <p id="location-status" role="status" aria-live="polite">Load recent eBird reports to choose a game mode.</p>
      <p class="attribution">Bird observations from <a href="https://ebird.org" target="_blank" rel="noopener noreferrer">eBird</a> (last 30 days).</p>
      <div id="mode-chooser" class="hidden" aria-labelledby="choose-title">
        <h2 id="choose-title">Choose a difficulty</h2>
        <div class="difficulty-list">
          <button class="difficulty" type="button" data-mode="0">0 — Starter show<span>Read the Polish name and reveal its English translation.</span></button>
          <button class="difficulty" type="button" data-mode="1">1 — Pick a translation<span>Choose the correct English name from four options.</span></button>
          <button class="difficulty" type="button" data-mode="2">2 — Connect<span>Match each Polish name with its English translation.</span></button>
          <button class="difficulty" type="button" data-mode="3">3 — Type it in<span>Type the translation of each bird name.</span></button>
        </div>
      </div>
    </section>
    <section id="game" class="hidden" aria-labelledby="mode-title">
      <div class="toolbar">
        <h2 id="mode-title"></h2>
        <button class="secondary" id="home-button" type="button">Choose difficulty</button>
      </div>
      <p id="progress"></p>
      <div id="activity"></div>
      <p id="message" role="status" aria-live="polite"></p>
      <div id="controls"></div>
    </section>
  </main>
  <script>
    const ebirdProxyUrl = "https://bird-words-ebird-proxy.protoooli.workers.dev";
    const polishNames = new Map([
      ["Barn Swallow", "Dymówka"],
      ["Black-headed Gull", "Śmieszka"],
      ["Common Blackbird", "Kos"],
      ["Common Buzzard", "Myszołów"],
      ["Common Chaffinch", "Zięba"],
      ["Common Chiffchaff", "Pierwiosnek"],
      ["Common Crane", "Żuraw"],
      ["Common Cuckoo", "Kukułka"],
      ["Common Kestrel", "Pustułka"],
      ["Common Linnet", "Makolągwa"],
      ["Common Moorhen", "Kura wodna"],
      ["Common Pheasant", "Bażant"],
      ["Common Reed Bunting", "Potrzos"],
      ["Common Snipe", "Kszyk"],
      ["Common Starling", "Szpak"],
      ["Common Swift", "Jerzyk"],
      ["Common Tern", "Rybitwa rzeczna"],
      ["Common Teal", "Cyraneczka"],
      ["Common Gull", "Mewa pospolita"],
      ["Common Wood Pigeon", "Grzywacz"],
      ["Common Wood-Pigeon", "Grzywacz"],
      ["Eurasian Blackcap", "Kapturka"],
      ["Eurasian Blue Tit", "Modraszka"],
      ["Eurasian Collared-Dove", "Sierpówka"],
      ["Eurasian Coot", "Łyska"],
      ["Eurasian Jackdaw", "Kawka"],
      ["Eurasian Jay", "Sójka"],
      ["Eurasian Magpie", "Sroka"],
      ["Eurasian Nuthatch", "Kowalik"],
      ["Eurasian Sparrowhawk", "Krogulec"],
      ["Eurasian Treecreeper", "Pełzacz leśny"],
      ["Eurasian Tree Sparrow", "Mazurek"],
      ["Eurasian Wigeon", "Świstun"],
      ["Eurasian Wren", "Strzyżyk"],
      ["European Greenfinch", "Dzwoniec"],
      ["European Robin", "Rudzik"],
      ["European Goldfinch", "Szczygieł"],
      ["Fieldfare", "Kwiczoł"],
      ["Great Cormorant", "Kormoran"],
      ["Great Crested Grebe", "Perkoz dwuczuby"],
      ["Great Egret", "Czapla biała"],
      ["Great Spotted Woodpecker", "Dzięcioł duży"],
      ["Great Tit", "Bogatka"],
      ["Gray Heron", "Czapla siwa"],
      ["Graylag Goose", "Gęgawa"],
      ["Hooded Crow", "Wrona siwa"],
      ["Herring Gull", "Mewa srebrzysta"],
      ["Common House-Martin", "Oknówka"],
      ["House Martin", "Oknówka"],
      ["House Sparrow", "Wróbel"],
      ["Little Grebe", "Perkozek"],
      ["Mallard", "Krzyżówka"],
      ["Common Pochard", "Głowienka"],
      ["Mute Swan", "Łabędź niemy"],
      ["Northern Lapwing", "Czajka"],
      ["Northern Shoveler", "Płaskonos"],
      ["Redwing", "Droździk"],
      ["Song Thrush", "Drozd śpiewak"],
      ["White Stork", "Bocian biały"],
      ["White Wagtail", "Pliszka siwa"],
      ["White-tailed Eagle", "Bielik"],
      ["Common Raven", "Kruk"],
      ["Yellowhammer", "Trznadel"]
    ]);
    const modes = [
      "0 — Starter show",
      "1 — Pick a translation",
      "2 — Connect",
      "3 — Type it in"
    ];
    let birds = [];
    const home = document.getElementById("home");
    const modeChooser = document.getElementById("mode-chooser");
    const game = document.getElementById("game");
    const modeTitle = document.getElementById("mode-title");
    const progress = document.getElementById("progress");
    const activity = document.getElementById("activity");
    const message = document.getElementById("message");
    const controls = document.getElementById("controls");
    const locationSelect = document.getElementById("location-select");
    const locationStatus = document.getElementById("location-status");
    const loadLocationButton = document.getElementById("load-location");
    let round = [];
    let mode = 0;
    let index = 0;
    let correctCount = 0;
    let answered = false;
    let selectedSource = null;
    let matched = new Set();

    function shuffle(items) {
      const shuffled = [...items];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function makeButton(text, className, onClick) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = className;
      button.textContent = text;
      button.addEventListener("click", onClick);
      return button;
    }

    async function loadLocationBirds() {
      if (!ebirdProxyUrl) {
        locationStatus.textContent = "Configure the Cloudflare Worker URL in index.html before loading eBird data.";
        return;
      }

      birds = [];
      modeChooser.classList.add("hidden");
      loadLocationButton.disabled = true;
      locationSelect.disabled = true;
      locationStatus.textContent = "Loading recent eBird observations…";
      try {
        const url = new URL("/observations", ebirdProxyUrl);
        url.searchParams.set("location", locationSelect.value);
        const response = await fetch(url);
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || `The bird data request failed (HTTP ${response.status}).`);
        }
        if (!Array.isArray(data)) {
          throw new Error("The eBird proxy returned an unexpected response.");
        }

        const translatedBirds = new Map();
        for (const observation of data) {
          const englishName = observation && observation.comName;
          const polishName = polishNames.get(englishName);
          if (polishName && !translatedBirds.has(englishName)) {
            translatedBirds.set(englishName, { en: englishName, pl: polishName });
          }
        }
        if (translatedBirds.size < 5) {
          throw new Error(`Only ${translatedBirds.size} recently reported species have Polish names in the game. Try another location later.`);
        }

        birds = [...translatedBirds.values()];
        locationStatus.textContent = `Loaded ${birds.length} translated species reported near ${locationSelect.selectedOptions[0].text} in the last 30 days.`;
        modeChooser.classList.remove("hidden");
      } catch (error) {
        locationStatus.textContent = `Could not load bird data: ${error.message}`;
      } finally {
        loadLocationButton.disabled = false;
        locationSelect.disabled = false;
      }
    }

    function startMode(selectedMode) {
      mode = selectedMode;
      round = shuffle(birds).slice(0, 5);
      index = 0;
      correctCount = 0;
      answered = false;
      selectedSource = null;
      matched = new Set();
      modeTitle.textContent = modes[mode];
      home.classList.add("hidden");
      game.classList.remove("hidden");
      renderQuestion();
    }

    function updateProgress() {
      progress.textContent = mode === 2
        ? `Matched ${matched.size} of ${round.length} pairs`
        : `Bird ${index + 1} of ${round.length} · Correct: ${correctCount}`;
    }

    function finishRound() {
      activity.replaceChildren();
      progress.textContent = `Round complete · Correct: ${correctCount} of ${round.length}`;
      message.textContent = "Great work! Choose another difficulty to play again.";
      controls.replaceChildren(makeButton("Choose difficulty", "primary", showHome));
    }

    function renderQuestion() {
      activity.replaceChildren();
      controls.replaceChildren();
      message.textContent = "";
      answered = false;
      updateProgress();
      if (mode === 0) renderShow();
      if (mode === 1) renderChoice();
      if (mode === 2) renderConnect();
      if (mode === 3) renderTyping();
    }

    function renderShow() {
      const bird = round[index];
      const prompt = document.createElement("p");
      prompt.className = "prompt";
      prompt.lang = "pl";
      prompt.textContent = bird.pl;
      activity.append(prompt);
      controls.append(makeButton("Show English", "primary", () => {
        if (answered) return;
        answered = true;
        const answer = document.createElement("p");
        answer.className = "prompt";
        answer.lang = "en";
        answer.textContent = bird.en;
        activity.append(answer);
        correctCount++;
        message.textContent = "Translation revealed.";
        controls.replaceChildren(makeButton(
          index === round.length - 1 ? "Finish round" : "Next bird",
          "primary",
          nextQuestion
        ));
      }));
    }

    function renderChoice() {
      const bird = round[index];
      const prompt = document.createElement("p");
      prompt.className = "prompt";
      prompt.lang = "pl";
      prompt.textContent = bird.pl;
      activity.append(prompt);
      const options = shuffle([bird, ...shuffle(birds.filter(item => item !== bird)).slice(0, 3)]);
      const answers = document.createElement("div");
      answers.className = "answers";
      for (const option of options) {
        const button = makeButton(option.en, "answer", () => {
          if (answered) return;
          answered = true;
          const isCorrect = option === bird;
          if (isCorrect) correctCount++;
          button.classList.add(isCorrect ? "correct" : "incorrect");
          for (const choice of answers.children) choice.disabled = true;
          message.textContent = isCorrect ? "Correct!" : `Not quite. The answer is ${bird.en}.`;
          showNextButton();
        });
        button.lang = "en";
        answers.append(button);
      }
      activity.append(answers);
    }

    function renderConnect() {
      const instructions = document.createElement("p");
      instructions.textContent = "Drag a Polish name to its English translation, or select a name and then its translation.";
      const columns = document.createElement("div");
      columns.className = "connect-columns";
      const polishList = document.createElement("div");
      polishList.className = "connect-list";
      polishList.setAttribute("aria-label", "Polish bird names");
      const englishList = document.createElement("div");
      englishList.className = "connect-list";
      englishList.setAttribute("aria-label", "English bird names");

      for (const bird of shuffle(round)) {
        const source = makeButton(bird.pl, "connect-item", () => {
          if (matched.has(bird)) return;
          selectedSource = bird;
          for (const item of polishList.children) item.setAttribute("aria-pressed", String(item === source));
          message.textContent = `Selected ${bird.pl}. Choose its English translation.`;
        });
        source.lang = "pl";
        source.draggable = true;
        source.setAttribute("aria-pressed", "false");
        source.addEventListener("dragstart", event => {
          event.dataTransfer.setData("text/plain", String(round.indexOf(bird)));
          event.dataTransfer.effectAllowed = "move";
          selectedSource = bird;
        });
        polishList.append(source);

        const target = makeButton(bird.en, "connect-item", () => {
          if (selectedSource) connectPair(selectedSource, bird);
        });
        target.lang = "en";
        target.addEventListener("dragover", event => {
          if (!matched.has(bird)) event.preventDefault();
        });
        target.addEventListener("drop", event => {
          event.preventDefault();
          const sourceIndex = Number(event.dataTransfer.getData("text/plain"));
          const draggedBird = round[sourceIndex];
          if (draggedBird) connectPair(draggedBird, bird);
        });
        englishList.append(target);
      }
      columns.append(polishList, englishList);
      activity.append(instructions, columns);
      updateProgress();
    }

    function connectPair(source, target) {
      if (matched.has(source) || matched.has(target)) return;
      if (source !== target) {
        selectedSource = null;
        const selectedButton = activity.querySelector('.connect-item[lang="pl"][aria-pressed="true"]');
        if (selectedButton) selectedButton.setAttribute("aria-pressed", "false");
        message.textContent = `Those names do not match. Try again.`;
        return;
      }
      matched.add(source);
      correctCount++;
      selectedSource = null;
      const items = activity.querySelectorAll(".connect-item");
      for (const item of items) {
        if ((item.lang === "pl" && item.textContent === source.pl)
          || (item.lang === "en" && item.textContent === source.en)) {
          item.classList.add("matched");
          item.disabled = true;
          item.setAttribute("aria-pressed", "false");
        }
      }
      updateProgress();
      message.textContent = `Matched ${source.pl} with ${source.en}.`;
      if (matched.size === round.length) finishRound();
    }

    function renderTyping() {
      const bird = round[index];
      const promptLanguage = Math.random() < 0.5 ? "en" : "pl";
      const answerLanguage = promptLanguage === "en" ? "pl" : "en";
      const prompt = document.createElement("p");
      prompt.className = "prompt";
      prompt.lang = promptLanguage;
      prompt.textContent = bird[promptLanguage];
      const form = document.createElement("form");
      const input = document.createElement("input");
      input.type = "text";
      input.autocomplete = "off";
      input.setAttribute("aria-label", `Type the ${answerLanguage === "en" ? "English" : "Polish"} translation`);
      input.required = true;
      const submit = document.createElement("button");
      submit.type = "submit";
      submit.className = "primary";
      submit.textContent = "Check answer";
      form.append(input, document.createTextNode(" "), submit);
      form.addEventListener("submit", event => {
        event.preventDefault();
        if (answered) return;
        const expected = bird[answerLanguage].toLocaleLowerCase().trim();
        const actual = input.value.toLocaleLowerCase().trim();
        const isCorrect = actual === expected;
        answered = true;
        if (isCorrect) correctCount++;
        input.disabled = true;
        submit.disabled = true;
        message.textContent = isCorrect
          ? "Correct!"
          : `The correct answer is ${bird[answerLanguage]}.`;
        showNextButton();
      });
      activity.append(prompt, form);
      input.focus();
    }

    function showNextButton() {
      controls.replaceChildren(makeButton(
        index === round.length - 1 ? "Finish round" : "Next bird",
        "primary",
        nextQuestion
      ));
    }

    function nextQuestion() {
      if (!answered) return;
      if (index === round.length - 1) {
        finishRound();
        return;
      }
      index++;
      renderQuestion();
    }

    function showHome() {
      game.classList.add("hidden");
      home.classList.remove("hidden");
      message.textContent = "";
    }

    locationSelect.addEventListener("change", () => {
      birds = [];
      modeChooser.classList.add("hidden");
      locationStatus.textContent = "Load recent eBird reports for this location to choose a game mode.";
    });
    loadLocationButton.addEventListener("click", loadLocationBirds);
    document.querySelectorAll(".difficulty").forEach(button => {
      button.addEventListener("click", () => startMode(Number(button.dataset.mode)));
    });
    document.getElementById("home-button").addEventListener("click", showHome);
  </script>
</body>
</html>

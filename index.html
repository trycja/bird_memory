<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bird Words — Memory Game</title>
  <style>
    @font-face {
      font-family: Inter;
      src: url("fonts/InterVariable.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
      color: #f2f8fb;
      background: #080612;
      scrollbar-gutter: stable;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem 1rem;
      min-height: 100vh;
      background: linear-gradient(#05030a66, #05030a66), url("assets/background.jpg") center / cover no-repeat fixed;
    }
    main { max-width: 760px; margin: auto; }
    header { margin: 0 0 2rem; text-align: left; }
    h1 {
      margin: 0;
      color: #e8e3dc;
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 600;
      letter-spacing: .04em;
      line-height: 1.1;
      text-shadow: 0 4px 24px #00000055;
      text-transform: uppercase;
    }
    h2 { margin: 0; font-size: 1.35rem; font-weight: 600; }
    #home, #game {
      border: 1px solid #f0e5f02e;
      border-radius: 1.5rem;
      box-shadow: 0 20px 60px #00000055, inset 0 1px 0 #ffffff1a;
      padding: clamp(1rem, 3vw, 1.75rem);
    }
    #home {
      background: #0c0a18c9;
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
    }
    #game { position: relative; isolation: isolate; }
    /* Blur a separate layer so the game navigation remains fixed to the viewport. */
    #game::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      background: #0c0a18c9;
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      pointer-events: none;
    }
    .location-controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: .75rem; margin: 1rem 0 .5rem; }
    .location-field { display: grid; min-width: 0; gap: .35rem; font-weight: 700; }
    select, input {
      width: 100%;
      min-width: 0;
      min-height: 44px;
      padding: .5rem;
      border: 1px solid #f0e5f040;
      border-radius: .75rem;
      background: #242d39;
      color: #f2f8fb;
      font: inherit;
      font-size: 1rem;
    }
    select { text-overflow: ellipsis; }
    #location-status { min-height: 1.5em; color: #f0cdd4; }
    .attribution { color: #cbd0da; text-align: center; font-size: .85rem; }
    a { color: #f5c2cb; }
    #mode-chooser { margin-top: 1.75rem; }
    .difficulty-list { display: grid; gap: .85rem; margin-top: 1rem; }
    .difficulty, .primary, .secondary, .answer, .connect-item {
      border: 1px solid #f0e5f040;
      border-radius: .85rem;
      padding: .7rem .8rem;
      background: #181426d9;
      box-shadow: 0 8px 20px #00000026, inset 0 1px 0 #ffffff1a;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      font: inherit;
      font-weight: 700;
    }
    .primary, .secondary { border-radius: 999px; }
    button { min-height: 44px; cursor: pointer; touch-action: manipulation; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 3px;
    }
    .primary { background: #35223cdb; color: #f2f8fb; }
    .difficulty {
      color: #f2f8fb;
      text-align: left;
    }
    .difficulty:not(:disabled):hover, .primary:not(:disabled):hover,
    .secondary:not(:disabled):hover, .answer:not(:disabled):hover, .connect-item:not(:disabled):hover {
      background: #4a3b54ed;
      border-color: #ffffff99;
    }
    .difficulty:not(:disabled):active, .primary:not(:disabled):active,
    .secondary:not(:disabled):active, .answer:not(:disabled):active, .connect-item:not(:disabled):active {
      background: #67506bef;
      border-color: #ffffffcc;
    }
    .primary:disabled { opacity: .6; cursor: not-allowed; }
    .difficulty span { display: block; margin-top: .2rem; font-weight: 500; line-height: 1.4; }
    #game { padding-bottom: calc(13rem + env(safe-area-inset-bottom)); }
    #fixed-controls {
      position: fixed;
      left: max(.75rem, env(safe-area-inset-left));
      right: max(.75rem, env(safe-area-inset-right));
      bottom: calc(.75rem + env(safe-area-inset-bottom));
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: .75rem;
      pointer-events: none;
    }
    #controls, #continuous-actions:not(.hidden) {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: .75rem;
      max-width: 100%;
    }
    #fixed-controls button { pointer-events: auto; }
    #controls .starter-nav { min-width: 8.5rem; }
    .reserved-button { visibility: hidden; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .75rem;
      margin: 1.75rem 0 1rem;
    }
    .secondary {
      background: #241a2cde;
      color: #f2f8fb;
    }
    .secondary:disabled { opacity: .6; cursor: not-allowed; }
    #progress {
      display: inline-block;
      padding: .4rem .65rem;
      border: 1px solid #e7bac45c;
      border-radius: 999px;
      background: #a7657a30;
      color: #ffe2e6;
      font-weight: 700;
    }
    .prompt {
      margin: 1.5rem 0;
      text-align: center;
      color: #f2f8fb;
      font-size: clamp(1.65rem, 5vw, 2.5rem);
      font-weight: 800;
      overflow-wrap: anywhere;
    }
    .prompt[lang="en"] { color: #f5c7ce; }
    .bird-photo { margin: 1rem auto; max-width: 500px; text-align: center; }
    .bird-photo img { display: block; max-width: 100%; max-height: 350px; margin: auto; border: 1px solid #f0e5f040; border-radius: 1rem; box-shadow: 0 12px 30px #00000055; }
    .bird-photo figcaption { margin-top: .75rem; color: #cbd0da; font-size: .85rem; overflow-wrap: anywhere; }
    .photo-status { text-align: center; color: #cbd0da; }
    .answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .85rem; }
    .answer {
      min-height: 4rem;
      color: #f2f8fb;
      overflow-wrap: anywhere;
    }
    .answer:disabled { cursor: default; opacity: 1; }
    .answer.correct, .connect-item.matched { background: linear-gradient(135deg, #254e40, #246f52); border-color: #9cebc2; }
    .answer.incorrect { background: linear-gradient(135deg, #5b303c, #774148); border-color: #ffb9b3; }
    .connect-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
    .connect-list { display: grid; min-width: 0; align-content: start; gap: .75rem; }
    .connect-item { width: 100%; color: #f2f8fb; overflow-wrap: anywhere; }
    .connect-item[aria-pressed="true"] { outline: 3px solid #f5c2cb; outline-offset: 2px; }
    .connect-item.matched { cursor: default; }
    .typing-form { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: .5rem; }
    input::placeholder { color: #bfc6d1; opacity: 1; }
    .typing-hint { white-space: pre-wrap; overflow-wrap: anywhere; color: #ffe3a1; }
    #message { min-height: 1.5em; text-align: center; font-weight: 700; color: #f0cdd4; }
    #message.correct { color: #b1f3cc; }
    #message.almost { color: #ffe3a1; }
    #message.wrong { color: #ffc1ba; }
    .hidden { display: none; }
    @media (max-width: 600px) {
      body { padding: 1.25rem .75rem; }
      header { margin-bottom: 1.5rem; }
      .location-controls { grid-template-columns: 1fr; }
      .answers { grid-template-columns: 1fr; }
      .connect-columns { gap: .45rem; }
      .connect-item { padding: .65rem .45rem; }
      .typing-form { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .typing-form input { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Bird Words</h1>
    </header>
    <section id="home" aria-labelledby="location-title">
      <h2 id="location-title">Choose a location</h2>
      <div class="location-controls">
        <label class="location-field" for="location-select">Recent bird reports near
          <select id="location-select">
            <option value="biebrza">Biebrzański Park Narodowy (50 km radius)</option>
            <option value="krakow">Kraków (30 km radius)</option>
          </select>
        </label>
        <button class="primary" id="load-location" type="button">Load birds</button>
      </div>
      <p id="location-status" role="status" aria-live="polite">Load recent eBird reports to choose a game mode.</p>
      <p class="attribution">Bird observations from <a href="https://ebird.org" target="_blank" rel="noopener noreferrer">eBird</a> (last 30 days).</p>
      <div id="mode-chooser" class="hidden" aria-labelledby="choose-title">
        <h2 id="choose-title">Choose a difficulty</h2>
        <div class="difficulty-list">
          <button class="difficulty" type="button" data-mode="0">0 — Starter show<span>Read the Polish name and reveal its English translation.</span></button>
          <button class="difficulty" type="button" data-mode="1">1 — Pick a translation<span>Choose the correct English name from four options.</span></button>
          <button class="difficulty" type="button" data-mode="2">2 — Connect<span>Match each Polish name with its English translation.</span></button>
          <button class="difficulty" type="button" data-mode="3">3 — Type it in<span>Type the translation of each bird name.</span></button>
        </div>
      </div>
    </section>
    <section id="game" class="hidden" aria-labelledby="mode-title">
      <div class="toolbar">
        <h2 id="mode-title"></h2>
        <button class="secondary" id="home-button" type="button">Choose difficulty</button>
      </div>
      <p id="progress"></p>
      <div id="activity"></div>
      <p id="message" role="status" aria-live="polite"></p>
      <div id="fixed-controls">
        <div id="controls"></div>
        <div id="continuous-actions" class="hidden"></div>
      </div>
    </section>
  </main>
  <script>
    const ebirdProxyUrl = "https://bird-words-ebird-proxy.protoooli.workers.dev";
    const polishNames = new Map([
      ["Barn Swallow", "Dymówka"],
      ["Black-headed Gull", "Śmieszka"],
      ["Common Blackbird", "Kos"],
      ["Common Buzzard", "Myszołów"],
      ["Common Chaffinch", "Zięba"],
      ["Common Chiffchaff", "Pierwiosnek"],
      ["Common Crane", "Żuraw"],
      ["Common Cuckoo", "Kukułka"],
      ["Common Kestrel", "Pustułka"],
      ["Common Linnet", "Makolągwa"],
      ["Common Moorhen", "Kura wodna"],
      ["Common Pheasant", "Bażant"],
      ["Common Reed Bunting", "Potrzos"],
      ["Common Snipe", "Kszyk"],
      ["Common Starling", "Szpak"],
      ["Common Swift", "Jerzyk"],
      ["Common Tern", "Rybitwa rzeczna"],
      ["Common Teal", "Cyraneczka"],
      ["Common Gull", "Mewa pospolita"],
      ["Common Wood Pigeon", "Grzywacz"],
      ["Common Wood-Pigeon", "Grzywacz"],
      ["Eurasian Blackcap", "Kapturka"],
      ["Eurasian Blue Tit", "Modraszka"],
      ["Eurasian Collared-Dove", "Sierpówka"],
      ["Eurasian Coot", "Łyska"],
      ["Eurasian Jackdaw", "Kawka"],
      ["Eurasian Jay", "Sójka"],
      ["Eurasian Magpie", "Sroka"],
      ["Eurasian Nuthatch", "Kowalik"],
      ["Eurasian Sparrowhawk", "Krogulec"],
      ["Eurasian Treecreeper", "Pełzacz leśny"],
      ["Eurasian Tree Sparrow", "Mazurek"],
      ["Eurasian Wigeon", "Świstun"],
      ["Eurasian Wren", "Strzyżyk"],
      ["European Greenfinch", "Dzwoniec"],
      ["European Robin", "Rudzik"],
      ["European Goldfinch", "Szczygieł"],
      ["Fieldfare", "Kwiczoł"],
      ["Great Cormorant", "Kormoran"],
      ["Great Crested Grebe", "Perkoz dwuczuby"],
      ["Great Egret", "Czapla biała"],
      ["Great Spotted Woodpecker", "Dzięcioł duży"],
      ["Great Tit", "Bogatka"],
      ["Gray Heron", "Czapla siwa"],
      ["Graylag Goose", "Gęgawa"],
      ["Hooded Crow", "Wrona siwa"],
      ["Herring Gull", "Mewa srebrzysta"],
      ["Common House-Martin", "Oknówka"],
      ["House Martin", "Oknówka"],
      ["House Sparrow", "Wróbel"],
      ["Little Grebe", "Perkozek"],
      ["Mallard", "Krzyżówka"],
      ["Common Pochard", "Głowienka"],
      ["Mute Swan", "Łabędź niemy"],
      ["Northern Lapwing", "Czajka"],
      ["Northern Shoveler", "Płaskonos"],
      ["Redwing", "Droździk"],
      ["Song Thrush", "Drozd śpiewak"],
      ["White Stork", "Bocian biały"],
      ["White Wagtail", "Pliszka siwa"],
      ["White-tailed Eagle", "Bielik"],
      ["Common Raven", "Kruk"],
      ["Yellowhammer", "Trznadel"]
    ]);
    const birdFamilies = [
      ["Barn Swallow", "Common House-Martin", "House Martin"],
      ["Black-headed Gull", "Common Gull", "Herring Gull", "Common Tern"],
      ["Common Blackbird", "Fieldfare", "Redwing", "Song Thrush"],
      ["Common Buzzard", "Eurasian Sparrowhawk", "White-tailed Eagle"],
      ["Common Chaffinch", "Common Linnet", "European Greenfinch", "European Goldfinch"],
      ["Common Chiffchaff"],
      ["Common Crane"],
      ["Common Cuckoo"],
      ["Common Kestrel"],
      ["Common Moorhen", "Eurasian Coot"],
      ["Common Pheasant"],
      ["Common Reed Bunting", "Yellowhammer"],
      ["Common Snipe"],
      ["Common Starling"],
      ["Common Swift"],
      ["Common Teal", "Eurasian Wigeon", "Graylag Goose", "Mallard", "Common Pochard", "Mute Swan", "Northern Shoveler"],
      ["Common Wood Pigeon", "Common Wood-Pigeon", "Eurasian Collared-Dove"],
      ["Eurasian Blackcap"],
      ["Eurasian Blue Tit", "Great Tit"],
      ["Eurasian Jackdaw", "Eurasian Jay", "Eurasian Magpie", "Hooded Crow", "Common Raven"],
      ["Eurasian Nuthatch"],
      ["Eurasian Treecreeper"],
      ["Eurasian Tree Sparrow", "House Sparrow"],
      ["Eurasian Wren"],
      ["European Robin"],
      ["Great Cormorant"],
      ["Great Crested Grebe", "Little Grebe"],
      ["Great Egret", "Gray Heron"],
      ["Great Spotted Woodpecker"],
      ["Northern Lapwing"],
      ["White Stork"],
      ["White Wagtail"]
    ];
    const modes = [
      "0 — Starter show",
      "1 — Pick a translation",
      "2 — Connect",
      "3 — Type it in"
    ];
    let birds = [];
    const home = document.getElementById("home");
    const modeChooser = document.getElementById("mode-chooser");
    const game = document.getElementById("game");
    const modeTitle = document.getElementById("mode-title");
    const progress = document.getElementById("progress");
    const activity = document.getElementById("activity");
    const message = document.getElementById("message");
    const controls = document.getElementById("controls");
    const continuousActions = document.getElementById("continuous-actions");
    const locationSelect = document.getElementById("location-select");
    const locationStatus = document.getElementById("location-status");
    const loadLocationButton = document.getElementById("load-location");
    let round = [];
    let mode = 0;
    let index = 0;
    let correctCount = 0;
    let answered = false;
    let selectedSource = null;
    let matched = new Set();
    let mistakes = new Set();
    let continuous = false;
    let practicing = false;
    let completedBirds = 0;
    let pausedGame = null;

    function shuffle(items) {
      const shuffled = [...items];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function makeButton(text, className, onClick) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = className;
      button.textContent = text;
      button.addEventListener("click", onClick);
      return button;
    }

    async function loadLocationBirds() {
      if (!ebirdProxyUrl) {
        locationStatus.textContent = "Configure the Cloudflare Worker URL in index.html before loading eBird data.";
        return;
      }

      birds = [];
      modeChooser.classList.add("hidden");
      loadLocationButton.disabled = true;
      locationSelect.disabled = true;
      locationStatus.textContent = "Loading recent eBird observations…";
      try {
        const url = new URL("/observations", ebirdProxyUrl);
        url.searchParams.set("location", locationSelect.value);
        const response = await fetch(url);
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || `The bird data request failed (HTTP ${response.status}).`);
        }
        if (!Array.isArray(data)) {
          throw new Error("The eBird proxy returned an unexpected response.");
        }

        const translatedBirds = new Map();
        for (const observation of data) {
          const englishName = observation && observation.comName;
          const polishName = polishNames.get(englishName);
          if (polishName && !translatedBirds.has(englishName)) {
            translatedBirds.set(englishName, { en: englishName, pl: polishName, scientificName: observation.sciName });
          }
        }
        if (translatedBirds.size < 5) {
          throw new Error(`Only ${translatedBirds.size} recently reported species have Polish names in the game. Try another location later.`);
        }

        birds = [...translatedBirds.values()];
        locationStatus.textContent = `Loaded ${birds.length} translated species reported near ${locationSelect.selectedOptions[0].text} in the last 30 days.`;
        modeChooser.classList.remove("hidden");
      } catch (error) {
        locationStatus.textContent = `Could not load bird data: ${error.message}`;
      } finally {
        loadLocationButton.disabled = false;
        locationSelect.disabled = false;
      }
    }

    function startMode(selectedMode) {
      mode = selectedMode;
      continuous = false;
      practicing = false;
      completedBirds = 0;
      pausedGame = null;
      modeTitle.textContent = modes[mode];
      home.classList.add("hidden");
      game.classList.remove("hidden");
      startRound(shuffle(birds).slice(0, 5));
    }

    function inContinuousPlay() {
      return continuous && !practicing;
    }

    function updateContinuousActions() {
      continuousActions.replaceChildren();
      continuousActions.classList.toggle("hidden", !inContinuousPlay());
      if (!inContinuousPlay()) return;
      const fixButton = makeButton("Fix mistakes", "secondary", startPractice);
      fixButton.disabled = mistakes.size === 0;
      continuousActions.append(fixButton, makeButton("Start over", "secondary", restartContinuous));
    }

    function keepPlaying() {
      continuous = true;
      completedBirds = round.length;
      round = shuffle(birds).slice(0, 5);
      index = 0;
      matched = new Set();
      selectedSource = null;
      renderQuestion();
    }

    function restartContinuous() {
      completedBirds = 0;
      startRound(shuffle(birds).slice(0, 5));
    }

    function startPractice() {
      if (!mistakes.size) return;
      pausedGame = {
        round, index, correctCount, answered, selectedSource, matched,
        activityNodes: [...activity.childNodes],
        controlNodes: [...controls.childNodes],
        progressText: progress.textContent,
        messageText: message.textContent,
        messageClass: message.className
      };
      practicing = true;
      startRound(shuffle([...mistakes]));
    }

    function resumeContinuous() {
      const remainingMistakes = mistakes;
      ({ round, index, correctCount, answered, selectedSource, matched } = pausedGame);
      activity.replaceChildren(...pausedGame.activityNodes);
      controls.replaceChildren(...pausedGame.controlNodes);
      progress.textContent = pausedGame.progressText;
      message.className = pausedGame.messageClass;
      message.textContent = `Practice complete. ${pausedGame.messageText}`.trim();
      mistakes = remainingMistakes;
      practicing = false;
      pausedGame = null;
      updateContinuousActions();
    }

    function startRound(roundBirds) {
      round = roundBirds;
      index = 0;
      correctCount = 0;
      answered = false;
      selectedSource = null;
      matched = new Set();
      mistakes = new Set();
      renderQuestion();
    }

    function updateProgress() {
      progress.textContent = mode === 2
        ? `Matched ${matched.size} of ${round.length} pairs${inContinuousPlay() ? ` · Total correct: ${correctCount}` : ""}`
        : inContinuousPlay()
          ? `Bird ${completedBirds + 1} · Correct: ${correctCount}`
          : `Bird ${index + 1} of ${round.length} · Correct: ${correctCount}`;
    }

    function finishRound() {
      if (practicing) {
        resumeContinuous();
        return;
      }
      activity.replaceChildren();
      progress.textContent = `Round complete · Correct: ${correctCount} of ${round.length}`;
      message.classList.remove("correct", "almost", "wrong");
      message.textContent = mistakes.size
        ? `Practice the ${mistakes.size} ${mistakes.size === 1 ? "bird" : "birds"} you missed, keep playing, or choose another difficulty.`
        : "Great work! Keep playing or choose another difficulty.";
      controls.replaceChildren();
      if (mistakes.size) {
        controls.append(makeButton("Fix mistakes", "primary", () => startRound(shuffle([...mistakes]))));
      }
      controls.append(makeButton("Keep playing", "primary", keepPlaying));
      controls.append(makeButton("Choose difficulty", "primary", showHome));
    }

    function renderQuestion() {
      activity.replaceChildren();
      controls.replaceChildren();
      message.classList.remove("correct", "almost", "wrong");
      message.textContent = "";
      answered = false;
      updateContinuousActions();
      updateProgress();
      if (mode === 0) renderShow();
      if (mode === 1) renderChoice();
      if (mode === 2) renderConnect();
      if (mode === 3) renderTyping();
    }

    async function showBirdPhoto(bird, container) {
      if (!bird.scientificName) {
        container.textContent = "Photo unavailable: no scientific name for this bird.";
        return;
      }

      try {
        const wikipediaUrl = new URL("https://en.wikipedia.org/w/api.php");
        wikipediaUrl.search = new URLSearchParams({
          action: "query", prop: "pageimages", titles: bird.scientificName,
          redirects: "1", piprop: "name", pilicense: "free", format: "json", origin: "*"
        });
        const pageResponse = await fetch(wikipediaUrl);
        if (!pageResponse.ok) throw new Error(`Wikipedia returned HTTP ${pageResponse.status}.`);
        const pageData = await pageResponse.json();
        const page = Object.values(pageData.query.pages)[0];
        if (!page.pageimage) throw new Error("No suitable image was found.");

        const commonsUrl = new URL("https://commons.wikimedia.org/w/api.php");
        commonsUrl.search = new URLSearchParams({
          action: "query", prop: "imageinfo", titles: `File:${page.pageimage}`,
          iiprop: "url|extmetadata", iiurlwidth: "500", format: "json", origin: "*"
        });
        const imageResponse = await fetch(commonsUrl);
        if (!imageResponse.ok) throw new Error(`Wikimedia Commons returned HTTP ${imageResponse.status}.`);
        const imageData = await imageResponse.json();
        const file = Object.values(imageData.query.pages)[0];
        const info = file.imageinfo && file.imageinfo[0];
        const metadata = info && info.extmetadata;
        const artistHtml = metadata && metadata.Artist && metadata.Artist.value;
        const license = metadata && metadata.LicenseShortName && metadata.LicenseShortName.value;
        const licenseUrl = metadata && metadata.LicenseUrl && metadata.LicenseUrl.value;
        const artist = artistHtml && new DOMParser().parseFromString(artistHtml, "text/html").body.textContent.trim();
        const attributionHtml = metadata && metadata.Attribution && metadata.Attribution.value;
        const attribution = attributionHtml && new DOMParser().parseFromString(attributionHtml, "text/html").body.textContent.trim();
        if (!info || !info.thumburl || !info.descriptionurl || !artist || !license || !licenseUrl) {
          throw new Error("Image credit or license information is missing.");
        }
        const imageUrl = new URL(info.thumburl);
        const sourceUrl = new URL(info.descriptionurl);
        const licenseLinkUrl = new URL(licenseUrl);
        if (imageUrl.protocol !== "https:" || !["upload.wikimedia.org", "thumb.wikimedia.org"].includes(imageUrl.hostname)
          || sourceUrl.protocol !== "https:" || sourceUrl.hostname !== "commons.wikimedia.org"
          || licenseLinkUrl.protocol !== "https:" || licenseLinkUrl.hostname !== "creativecommons.org"
          || !/^\/(?:licenses\/(?:by|by-sa)|publicdomain\/(?:zero|mark))\/[0-9.]+\/?$/.test(licenseLinkUrl.pathname)) {
          throw new Error("Image or credit links are not valid.");
        }

        const figure = document.createElement("figure");
        figure.className = "bird-photo";
        const image = document.createElement("img");
        image.alt = `Photo of ${bird.en}`;
        image.addEventListener("error", () => {
          if (container.isConnected) container.textContent = "Photo unavailable: the image could not be loaded.";
        });
        image.src = imageUrl.href;
        const caption = document.createElement("figcaption");
        const source = document.createElement("a");
        source.href = sourceUrl.href;
        source.target = "_blank";
        source.rel = "noopener noreferrer";
        source.textContent = file.title.replace(/^File:/, "");
        const licenseLink = document.createElement("a");
        licenseLink.href = licenseLinkUrl.href;
        licenseLink.target = "_blank";
        licenseLink.rel = "noopener noreferrer";
        licenseLink.textContent = license;
        const credit = attribution && attribution !== artist ? `${artist} (${attribution})` : artist;
        caption.append(source, document.createTextNode(` by ${credit} · resized · `), licenseLink);
        figure.append(image, caption);
        container.replaceChildren(figure);
      } catch (error) {
        container.textContent = `Photo unavailable: ${error.message}`;
      }
    }

    function renderShow() {
      const bird = round[index];
      const prompt = document.createElement("p");
      prompt.className = "prompt";
      prompt.lang = "pl";
      prompt.textContent = bird.pl;
      activity.append(prompt);
      function setStarterControls(button, showFinish) {
        button.classList.add("starter-nav");
        if (inContinuousPlay()) {
          controls.replaceChildren(button);
          return;
        }
        const finishButton = makeButton("Finish round", "primary", nextQuestion);
        if (!showFinish) {
          finishButton.classList.add("reserved-button");
          finishButton.disabled = true;
        }
        controls.replaceChildren(button, finishButton);
      }
      setStarterControls(makeButton("Show English", "primary", () => {
        if (answered) return;
        answered = true;
        const answer = document.createElement("p");
        answer.className = "prompt";
        answer.lang = "en";
        answer.textContent = bird.en;
        activity.append(answer);
        const photo = document.createElement("div");
        photo.className = "photo-status";
        photo.setAttribute("role", "status");
        photo.textContent = "Loading bird photo…";
        activity.append(photo);
        showBirdPhoto(bird, photo);
        correctCount++;
        message.textContent = "Translation revealed.";
        const nextButton = makeButton("Next bird", "primary", nextQuestion);
        if (!inContinuousPlay() && index === round.length - 1) {
          nextButton.disabled = true;
        }
        setStarterControls(nextButton, index === round.length - 1);
      }), false);
    }

    function choiceOptions(bird) {
      const family = birdFamilies.find(members => members.includes(bird.en));
      if (!family) throw new Error(`Missing bird family for ${bird.en}.`);
      const candidates = [
        ...shuffle(birds.filter(item => family.includes(item.en))),
        ...shuffle(family.map(en => ({ en, pl: polishNames.get(en) }))),
        ...shuffle(birds),
        ...shuffle([...polishNames].map(([en, pl]) => ({ en, pl })))
      ];
      const seen = new Set([bird.pl]);
      const alternatives = [];
      for (const candidate of candidates) {
        if (!candidate.pl || seen.has(candidate.pl)) continue;
        seen.add(candidate.pl);
        alternatives.push(candidate);
        if (alternatives.length === 3) break;
      }
      return shuffle([bird, ...alternatives]);
    }

    function renderChoice() {
      const bird = round[index];
      const prompt = document.createElement("p");
      prompt.className = "prompt";
      prompt.lang = "pl";
      prompt.textContent = bird.pl;
      activity.append(prompt);
      const options = choiceOptions(bird);
      const answers = document.createElement("div");
      answers.className = "answers";
      for (const option of options) {
        const button = makeButton(option.en, "answer", () => {
          if (answered) return;
          answered = true;
          const isCorrect = option === bird;
          if (isCorrect) correctCount++;
          else mistakes.add(bird);
          updateContinuousActions();
          button.classList.add(isCorrect ? "correct" : "incorrect");
          for (const choice of answers.children) choice.disabled = true;
          message.textContent = isCorrect ? "Correct!" : `Not quite. The answer is ${bird.en}.`;
          showNextButton();
        });
        button.lang = "en";
        answers.append(button);
      }
      activity.append(answers);
    }

    function renderConnect() {
      const instructions = document.createElement("p");
      instructions.textContent = "Drag a Polish name to its English translation, or select a name and then its translation.";
      const columns = document.createElement("div");
      columns.className = "connect-columns";
      const polishList = document.createElement("div");
      polishList.className = "connect-list";
      polishList.setAttribute("aria-label", "Polish bird names");
      const englishList = document.createElement("div");
      englishList.className = "connect-list";
      englishList.setAttribute("aria-label", "English bird names");

      for (const bird of shuffle(round)) {
        const source = makeButton(bird.pl, "connect-item", () => {
          if (matched.has(bird)) return;
          selectedSource = bird;
          for (const item of polishList.children) item.setAttribute("aria-pressed", String(item === source));
          message.textContent = `Selected ${bird.pl}. Choose its English translation.`;
        });
        source.lang = "pl";
        source.draggable = true;
        source.setAttribute("aria-pressed", "false");
        source.addEventListener("dragstart", event => {
          event.dataTransfer.setData("text/plain", String(round.indexOf(bird)));
          event.dataTransfer.effectAllowed = "move";
          selectedSource = bird;
        });
        polishList.append(source);

        const target = makeButton(bird.en, "connect-item", () => {
          if (selectedSource) connectPair(selectedSource, bird);
        });
        target.lang = "en";
        target.addEventListener("dragover", event => {
          if (!matched.has(bird)) event.preventDefault();
        });
        target.addEventListener("drop", event => {
          event.preventDefault();
          const sourceIndex = Number(event.dataTransfer.getData("text/plain"));
          const draggedBird = round[sourceIndex];
          if (draggedBird) connectPair(draggedBird, bird);
        });
        englishList.append(target);
      }
      englishList.replaceChildren(...shuffle([...englishList.children]));
      columns.append(polishList, englishList);
      activity.append(instructions, columns);
      updateProgress();
    }

    function connectPair(source, target) {
      if (matched.has(source) || matched.has(target)) return;
      if (source !== target) {
        mistakes.add(source);
        updateContinuousActions();
        selectedSource = null;
        const selectedButton = activity.querySelector('.connect-item[lang="pl"][aria-pressed="true"]');
        if (selectedButton) selectedButton.setAttribute("aria-pressed", "false");
        message.textContent = `Those names do not match. Try again.`;
        return;
      }
      matched.add(source);
      correctCount++;
      selectedSource = null;
      const items = activity.querySelectorAll(".connect-item");
      for (const item of items) {
        if ((item.lang === "pl" && item.textContent === source.pl)
          || (item.lang === "en" && item.textContent === source.en)) {
          item.classList.add("matched");
          item.disabled = true;
          item.setAttribute("aria-pressed", "false");
        }
      }
      updateProgress();
      message.textContent = `Matched ${source.pl} with ${source.en}.`;
      if (matched.size === round.length) {
        if (inContinuousPlay()) {
          controls.replaceChildren(makeButton("Next birds", "primary", nextConnectGroup));
        } else {
          finishRound();
        }
      }
    }

    function nextConnectGroup() {
      completedBirds += round.length;
      round = shuffle(birds).slice(0, 5);
      matched = new Set();
      selectedSource = null;
      renderQuestion();
    }

    function typingResult(input, answer) {
      const actual = Array.from(input.trim().normalize("NFC").toLocaleLowerCase("pl"));
      const expected = Array.from(answer.trim().normalize("NFC").toLocaleLowerCase("pl"));
      if (actual.join("") === expected.join("")) return "correct";
      if (!actual.length || Math.abs(actual.length - expected.length) > 1) return "wrong";

      if (actual.length === expected.length) {
        const differences = [];
        for (let i = 0; i < actual.length; i++) {
          if (actual[i] !== expected[i]) differences.push(i);
        }
        if (differences.length === 1) return "almost";
        if (differences.length === 2
          && differences[1] === differences[0] + 1
          && actual[differences[0]] === expected[differences[1]]
          && actual[differences[1]] === expected[differences[0]]) return "almost";
        return "wrong";
      }

      const shorter = actual.length < expected.length ? actual : expected;
      const longer = actual.length < expected.length ? expected : actual;
      let shortIndex = 0;
      let longIndex = 0;
      let skipped = false;
      while (shortIndex < shorter.length && longIndex < longer.length) {
        if (shorter[shortIndex] === longer[longIndex]) {
          shortIndex++;
        } else if (skipped) {
          return "wrong";
        } else {
          skipped = true;
        }
        longIndex++;
      }
      return "almost";
    }

    function renderTyping() {
      const bird = round[index];
      const promptLanguage = Math.random() < 0.5 ? "en" : "pl";
      const answerLanguage = promptLanguage === "en" ? "pl" : "en";
      const prompt = document.createElement("p");
      prompt.className = "prompt";
      prompt.lang = promptLanguage;
      prompt.textContent = bird[promptLanguage];
      const form = document.createElement("form");
      form.className = "typing-form";
      const input = document.createElement("input");
      input.type = "text";
      input.autocomplete = "off";
      input.placeholder = `${answerLanguage === "en" ? "English" : "Polish"} translation`;
      input.setAttribute("aria-label", `Type the ${input.placeholder}`);
      input.required = true;
      const submit = document.createElement("button");
      submit.type = "submit";
      submit.className = "primary";
      submit.textContent = "Check answer";
      const answerCharacters = Array.from(bird[answerLanguage].normalize("NFC"));
      const letterPositions = answerCharacters.flatMap((character, position) =>
        /\p{L}/u.test(character) ? [position] : []
      );
      const hintCharacters = answerCharacters.map(character => /\p{L}/u.test(character) ? "_" : character);
      let revealedLetters = 0;
      const hint = document.createElement("p");
      hint.id = "typing-hint";
      hint.className = "typing-hint";
      hint.lang = answerLanguage;
      hint.setAttribute("role", "status");
      const showLetter = makeButton("Show letter", "secondary", () => {
        const position = letterPositions[revealedLetters++];
        hintCharacters[position] = answerCharacters[position];
        hint.textContent = `Hint: ${hintCharacters.join("")}`;
        showLetter.disabled = revealedLetters === letterPositions.length;
      });
      showLetter.setAttribute("aria-controls", hint.id);
      showLetter.disabled = letterPositions.length === 0;
      form.append(input, document.createTextNode(" "), submit, document.createTextNode(" "), showLetter);
      form.addEventListener("submit", event => {
        event.preventDefault();
        if (answered) return;
        const result = typingResult(input.value, bird[answerLanguage]);
        answered = true;
        if (result === "correct") correctCount++;
        else mistakes.add(bird);
        updateContinuousActions();
        input.disabled = true;
        submit.disabled = true;
        showLetter.disabled = true;
        message.classList.add(result);
        message.textContent = result === "correct"
          ? "Correct!"
          : `${result === "almost" ? "Almost:" : "Wrong!"} The correct answer is ${bird[answerLanguage]}.`;
        showNextButton();
      });
      activity.append(prompt, form, hint);
      if (!window.matchMedia("(pointer: coarse)").matches) input.focus();
    }

    function showNextButton() {
      controls.replaceChildren(makeButton(
        !inContinuousPlay() && index === round.length - 1 ? "Finish round" : "Next bird",
        "primary",
        nextQuestion
      ));
    }

    function nextQuestion() {
      if (!answered) return;
      if (inContinuousPlay()) {
        completedBirds++;
        if (index === round.length - 1) {
          round = shuffle(birds).slice(0, 5);
          index = 0;
        } else {
          index++;
        }
        renderQuestion();
        return;
      }
      if (index === round.length - 1) {
        finishRound();
        return;
      }
      index++;
      renderQuestion();
    }

    function showHome() {
      game.classList.add("hidden");
      home.classList.remove("hidden");
      message.textContent = "";
    }

    locationSelect.addEventListener("change", () => {
      birds = [];
      modeChooser.classList.add("hidden");
      locationStatus.textContent = "Load recent eBird reports for this location to choose a game mode.";
    });
    loadLocationButton.addEventListener("click", loadLocationBirds);
    document.querySelectorAll(".difficulty").forEach(button => {
      button.addEventListener("click", () => startMode(Number(button.dataset.mode)));
    });
    document.getElementById("home-button").addEventListener("click", showHome);
  </script>
</body>
</html>
